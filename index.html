<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liam's Schedule</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f7f4;--surface:#fff;--border:#e8e4de;--text:#1a1a18;--muted:#6b6860;
  --work:#ddeeff;--work-b:#b0cfe8;--work-t:#0a3d6b;
  --gym:#d8f2e8;--gym-b:#8fd4b4;--gym-t:#084f38;
  --study:#eceafd;--study-b:#b8b0f0;--study-t:#2e2480;
  --caff:#e4f2d4;--caff-b:#a8d080;--caff-t:#1e4a08;
  --shake:#eeece8;--shake-b:#c0bdb6;--shake-t:#3a3830;
  --walk:#fdf0d8;--walk-b:#f0c870;--walk-t:#5a3a08;
  --church:#fde8e0;--church-b:#f0a880;--church-t:#5a2010;
  --meal:#fce8f0;--meal-b:#e8a8c4;--meal-t:#6b1a3a;
  --free:#f0eee8;--free-b:#d0cdc8;--free-t:#4a4844;
  --vac:#fff8e0;--vac-b:#f0d060;--vac-t:#5a4000;
  --empty:#f5f4f1;--empty-b:#dddbd5;--empty-t:#888680;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:1rem 1.25rem;position:sticky;top:0;z-index:100}
header h1{font-size:1rem;font-weight:600}
header p{font-size:0.72rem;color:var(--muted);margin-top:2px}
.nav-row{background:var(--surface);border-bottom:1px solid var(--border);padding:0.75rem 1.25rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav-label{font-size:0.72rem;color:var(--muted);font-weight:600;margin-right:2px}
.week-select,.day-select{font-size:0.8rem;padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
.jump-btn{font-size:0.72rem;padding:5px 12px;border-radius:8px;border:1px solid var(--border);background:var(--study);color:var(--study-t);cursor:pointer;font-weight:600}
.jump-btn:hover{opacity:0.85}
.day-meta{background:var(--surface);border-bottom:1px solid var(--border);padding:0.6rem 1.25rem;font-size:0.72rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.day-meta strong{color:var(--text)}
.day-view{padding:0.75rem 1.25rem 4rem;max-width:600px;margin:0 auto}
.block{border-radius:10px;margin-bottom:7px;overflow:hidden;border:1px solid;cursor:pointer;transition:transform 0.1s}
.block:active{transform:scale(0.99)}
.block.no-expand{cursor:default}
.block-header{display:flex;align-items:flex-start;gap:10px;padding:9px 13px}
.block-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.block-left{flex:1;min-width:0}
.block-time{font-size:0.67rem;font-weight:600;letter-spacing:0.04em;opacity:0.7;margin-bottom:1px}
.block-title{font-size:0.86rem;font-weight:600;line-height:1.3}
.block-sub{font-size:0.76rem;margin-top:4px;line-height:1.5}
.block-sub strong{font-weight:700}
.block-chevron{font-size:0.65rem;opacity:0.45;transition:transform 0.2s;flex-shrink:0;margin-top:4px}
.block.open .block-chevron{transform:rotate(180deg)}
.block-body{padding:0 13px 11px;font-size:0.78rem;line-height:1.55;display:none}
.block.open .block-body{display:block}
.block-body p{margin-bottom:5px;opacity:0.9}
.block-body p:last-child{margin-bottom:0}
.step{display:flex;gap:8px;margin-bottom:5px;align-items:flex-start}
.step-num{font-size:0.65rem;font-weight:700;width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(0,0,0,0.08);margin-top:1px}
.step-text{font-size:0.76rem;line-height:1.45}
.study-steps{margin-top:7px;border-top:1px solid rgba(0,0,0,0.08);padding-top:7px}
.mod-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,0.06);border-radius:5px;padding:3px 8px;font-size:0.68rem;font-weight:600;margin-bottom:6px}
.type-pill{font-size:0.63rem;font-weight:600;padding:1px 6px;border-radius:4px;background:rgba(0,0,0,0.08)}
.b-work{background:var(--work);border-color:var(--work-b);color:var(--work-t)}
.b-gym{background:var(--gym);border-color:var(--gym-b);color:var(--gym-t)}
.b-study{background:var(--study);border-color:var(--study-b);color:var(--study-t)}
.b-caff{background:var(--caff);border-color:var(--caff-b);color:var(--caff-t)}
.b-shake{background:var(--shake);border-color:var(--shake-b);color:var(--shake-t)}
.b-walk{background:var(--walk);border-color:var(--walk-b);color:var(--walk-t)}
.b-church{background:var(--church);border-color:var(--church-b);color:var(--church-t)}
.b-meal{background:var(--meal);border-color:var(--meal-b);color:var(--meal-t)}
.b-free{background:var(--free);border-color:var(--free-b);color:var(--free-t)}
.b-vac{background:var(--vac);border-color:var(--vac-b);color:var(--vac-t)}
.b-empty{background:var(--empty);border-color:var(--empty-b);color:var(--empty-t)}
.progress-bar{height:3px;background:var(--border)}
.progress-fill{height:100%;background:#7F77DD;transition:width 0.3s}
.legend{display:flex;flex-wrap:wrap;gap:7px;padding:0.6rem 1.25rem;background:var(--surface);border-bottom:1px solid var(--border)}
.leg{display:flex;align-items:center;gap:4px;font-size:0.67rem;color:var(--muted)}
.leg-dot{width:7px;height:7px;border-radius:50%}
</style>
</head>

<script>
// Schedule starts Thursday May 29 2025
// Week 1 begins Thursday — so Mon/Tue/Wed of week 1 are "not started yet"
const SCHEDULE_START = new Date(2025, 4, 29); // May 29 2025 (Thursday)
const TOTAL_WEEKS = 22;

// Days in order, week starts Monday
const DAYS = ['mon','tue','wed','thu','fri','sat','sun'];
const DAY_NAMES = {mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday',sun:'Sunday'};

// Which days in week 1 are before the schedule start (Thu May 29)
// Week 1 Mon=May 26, Tue=May 27, Wed=May 28 — all before May 29, so show empty
const WEEK1_START_DAY = 'thu'; // first active day of week 1

// Vacation sets — stored as absolute date strings YYYY-M-D
const VAC_FULL = new Set([
  '2025-6-6','2025-6-7',
  '2025-7-24','2025-7-25','2025-7-26','2025-7-27','2025-7-28',
  '2025-7-29','2025-7-30','2025-7-31','2025-8-1'
]);
// June 5: leaves 4:50pm — work+gym happen, study skipped
const VAC_PARTIAL_STUDY = new Set(['2025-6-5']);

function getAbsDate(w, day) {
  // Week 1 Monday = May 26 2025
  const weekMonday = new Date(2025, 4, 26); // May 26
  weekMonday.setDate(weekMonday.getDate() + (w - 1) * 7);
  const off = DAYS.indexOf(day);
  const d = new Date(weekMonday);
  d.setDate(weekMonday.getDate() + off);
  return d;
}

function dateKey(d) {
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}

function isBeforeStart(w, day) {
  if (w > 1) return false;
  // Week 1: Mon/Tue/Wed are before May 29
  return ['mon','tue','wed'].includes(day);
}

function isVacFull(w, day) {
  return VAC_FULL.has(dateKey(getAbsDate(w, day)));
}

function isVacPartialStudy(w, day) {
  return VAC_PARTIAL_STUDY.has(dateKey(getAbsDate(w, day)));
}

  {w:2,day:'thu',mod:1,sec:'E',topic:'Supply & Demand Alignment',focus:'S&OP process, integrated business planning (IBP), consensus forecasting, balancing supply and demand. Leaving 4:50 PM — study block skipped today.',type:'new'},
  {w:2,day:'fri',mod:1,sec:'vacation',topic:'Vacation — no study',focus:'Away until June 7 11PM. Rest and recharge.',type:'vac'},
  {w:2,day:'sat',mod:1,sec:'vacation',topic:'Vacation — no study',focus:'Away until June 7 11PM. Rest and recharge.',type:'vac'},

  // WEEK 3 — make up Jun 5-7 content
  {w:3,day:'mon',mod:1,sec:'E',topic:'S&OP — make-up from Jun 5',focus:'Supply & Demand Alignment full session. S&OP process, IBP, consensus forecasting, balancing supply and demand.',type:'new'},
  {w:3,day:'tue',mod:1,sec:'E',topic:'M1E review + M1 full recall',focus:'S&OP recall. Then write a one-page brain dump of everything you know about Module 1 with no book.',type:'review'},

  {w:4,day:'mon',mod:2,sec:'B',topic:'End-to-End Connectivity & Visibility',focus:'Information flows, supply chain visibility tools, EDI, APIs, integration across tiers, bullwhip effect.',type:'new'},
  {w:4,day:'tue',mod:2,sec:'B',topic:'Visibility + bullwhip effect review',focus:'Bullwhip effect causes and remedies from memory. 10 practice questions on M2B.',type:'review'},

  {w:7,day:'mon',mod:4,sec:'A',topic:'Planning Operations — S&OP & MPS',focus:'Sales & Operations Planning in depth, Master Production Schedule (MPS), demand time fence, planning time fence.',type:'new'},

  {w:7,day:'thu',mod:4,sec:'A',topic:'MRP logic & inputs',focus:'Material Requirements Planning: BOM, inventory records, MPS as input. Gross to net calculations. Work through examples.',type:'new'},
  {w:7,day:'fri',mod:4,sec:'A',topic:'MRP calculations',focus:'Net requirements, planned order releases. Do MRP calculation problems by hand — heavily tested.',type:'new'},
  {w:7,day:'sat',mod:4,sec:'A',topic:'M4A full session — MRP/MPS calculations',focus:'Dedicated calculation session. Work every MRP and MPS problem available. Check answers. Redo anything wrong.',type:'new'},

  // WEEK 8
  {w:8,day:'mon',mod:4,sec:'B',topic:'Capacity Planning',focus:'Capacity requirements planning (CRP), demonstrated vs rated capacity, efficiency and utilization calculations.',type:'new'},
  {w:8,day:'tue',mod:4,sec:'B',topic:'Capacity calculations review',focus:'Utilization = actual/available. Efficiency = actual/standard. Reconstruct formulas and work problems.',type:'review'},

const modNames = {
  1:'M1 — Supply Chains, Demand & Forecasting',
  2:'M2 — Global Supply Chain Networks',
  3:'M3 — Sourcing Products & Services',
  4:'M4 — Internal Operations & Inventory',
  5:'M5 — Forward & Reverse Logistics',
  6:'M6 — Supply Chain Relationships',
  7:'M7 — Supply Chain Risk',
  8:'M8 — Optimization, Sustainability & Technology'
};

const phases = [
  {weeks:[1,4], label:'Phase 1', weekdayMins:60, satMins:90},
  {weeks:[5,9], label:'Phase 2', weekdayMins:75, satMins:120},
  {weeks:[10,14],label:'Phase 3', weekdayMins:90, satMins:120},
  {weeks:[15,22],label:'Phase 4', weekdayMins:120,satMins:150},
];

function getPhase(w) {
  return phases.find(p => w >= p.weeks[0] && w <= p.weeks[1]) || phases[3];
}
function getStudyMins(day, w) {
  const p = getPhase(w);
  return day === 'sat' ? p.satMins : p.weekdayMins;
}
function getDayPlan(w, day) {
  return plan.find(p => p.w === w && p.day === day) || null;
}

function fmt(h, m) {
  const ap = h < 12 ? 'AM' : 'PM';
  const dh = h === 0 ? 12 : h > 12 ? h - 12 : h;
  return dh + ':' + (m < 10 ? '0' : '') + m + ' ' + ap;
}
function addM(h, m, mins) {
  const t = h * 60 + m + mins;
  return [Math.floor(t / 60) % 24, t % 60];
}
function fmtMins(mins) {
  if (mins < 60) return mins + 'm';
  const h = Math.floor(mins / 60), m = mins % 60;
  return h + 'h' + (m ? m + 'm' : '');
}

function getSteps(mins) {
  if (mins <= 60) return [
    {n:1,t:'5 min',s:'Prime — skim chapter headings, ask what you already know'},
    {n:2,t:'30 min',s:'Active reading — write main ideas in your own words, pause and summarize every few pages'},
    {n:3,t:'25 min',s:'Active recall — close book, write everything from memory, then 10–15 practice questions. Review wrong answers immediately.'}
  ];
  if (mins <= 90) return [
    {n:1,t:'5 min',s:'Prime — skim headings, activate prior knowledge'},
    {n:2,t:'25 min',s:'Active reading — Unit 1, margin notes, summarize every few pages'},
    {n:3,t:'15 min',s:'Recall Unit 1 — close book, write from scratch, 10 questions'},
    {n:4,t:'5 min',s:'Reset — stand up, water, no phone'},
    {n:5,t:'25 min',s:'Active reading — Unit 2 or deeper review of Unit 1'},
    {n:6,t:'15 min',s:'Final recall + quiz — 15 questions, review wrong answers immediately'}
  ];
  if (mins <= 120) return [
    {n:1,t:'5 min',s:'Prime — skim all headings'},
    {n:2,t:'25 min',s:'Active reading — Unit 1'},
    {n:3,t:'15 min',s:'Recall Unit 1 — close book, write, 10 questions'},
    {n:4,t:'5 min',s:'Break — water, stand up'},
    {n:5,t:'25 min',s:'Active reading — Unit 2'},
    {n:6,t:'15 min',s:'Recall Unit 2 — close book, write, 10 questions'},
    {n:7,t:'10 min',s:'Cumulative recall — connect both units from memory in one paragraph'}
  ];
  return [
    {n:1,t:'5 min',s:'Prime — skim all headings'},
    {n:2,t:'25 min',s:'Active reading — Unit 1'},
    {n:3,t:'15 min',s:'Recall Unit 1 — close book, write, 10 questions'},
    {n:4,t:'5 min',s:'Break'},
    {n:5,t:'25 min',s:'Active reading — Unit 2'},
    {n:6,t:'15 min',s:'Recall Unit 2 — close book, write, 10 questions'},
    {n:7,t:'5 min',s:'Break'},
    {n:8,t:'25 min',s:'Active reading — Unit 3 or deep review'},
    {n:9,t:'15 min',s:'Final recall + cumulative quiz — 20+ questions, review every wrong answer'}
  ];
}

function blk(cls, dot, time, title, sub, body, noExp) {
  const id = 'b' + Math.random().toString(36).substr(2,6);
  const ch = noExp ? '' : '<span class="block-chevron">▼</span>';
  const oc = noExp ? '' : 'onclick="tog(\'' + id + '\')"';
  const nc = noExp ? ' no-expand' : '';
  const subHtml = sub ? '<div class="block-sub">' + sub + '</div>' : '';
  const bodyHtml = body ? '<div class="block-body">' + body + '</div>' : '';
  return `<div class="block ${cls}${nc}" id="${id}" ${oc}>
    <div class="block-header">
      <div class="block-dot" style="background:${dot}"></div>
      <div class="block-left">
        <div class="block-time">${time}</div>
        <div class="block-title">${title}</div>${subHtml}
      </div>${ch}
    </div>${bodyHtml}
  </div>`;
}

function tog(id) { document.getElementById(id).classList.toggle('open'); }

function buildStudyBlock(dp, mins, h, m) {
  const endArr = addM(h, m, mins);
  const steps = getSteps(mins);
  const stepsHtml = steps.map(s =>
    `<div class="step"><div class="step-num">${s.n}</div><div class="step-text"><strong>${s.t}</strong> — ${s.s}</div></div>`
  ).join('');
  let badge = '';
  let topicHtml = '';
  if (dp && dp.type !== 'vac') {
    const tl = dp.type === 'review' ? 'Review' : dp.type === 'exam' ? 'Exam simulation' : 'New content';
    badge = `<div class="mod-badge">${modNames[dp.mod] || ''}<span class="type-pill">${tl}</span></div>`;
    topicHtml = `<p><strong>${dp.topic}</strong></p><p>${dp.focus}</p>`;
  }
  const body = badge + topicHtml + `<div class="study-steps">${stepsHtml}</div>`;
  return blk('b-study', '#6050c0', fmt(h, m) + ' – ' + fmt(endArr[0], endArr[1]),
    'APICS Study — ' + fmtMins(mins), '', body);
}

function buildSelectors() {
  const wSel = document.getElementById('weekSel');
  for (let w = 1; w <= TOTAL_WEEKS; w++) {
    // Week label date = Thursday of that week (first active day of week 1)
    const d = new Date(SCHEDULE_START);
    d.setDate(d.getDate() + (w - 1) * 7);
    const ph = getPhase(w);
    const o = document.createElement('option');
    o.value = w;
    o.textContent = `Week ${w} — ${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})} (${ph.label})`;
    wSel.appendChild(o);
  }
  DAYS.forEach(v => {
    const o = document.createElement('option');
    o.value = v;
    o.textContent = DAY_NAMES[v];
    document.getElementById('daySel').appendChild(o);
  });
}

function jumpToday() {
  const now = new Date();
  now.setHours(0,0,0,0);
  const start = new Date(2025, 4, 26); // Week 1 Monday = May 26
  const diffMs = now - start;
  const diffDays = Math.floor(diffMs / (24*3600*1000));
  if (diffDays < 0) {
    // Before schedule
    document.getElementById('weekSel').value = 1;
    document.getElementById('daySel').value = 'thu';
    render();
    return;
  }
  const w = Math.min(TOTAL_WEEKS, Math.floor(diffDays / 7) + 1);
  const dayIdx = diffDays % 7; // 0=Mon,1=Tue,...,6=Sun
  const day = DAYS[dayIdx];
  document.getElementById('weekSel').value = w;
  document.getElementById('daySel').value = day;
  render();
}

buildSelectors();
jumpToday();
</script>
</body>
</html>
